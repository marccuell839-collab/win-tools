name: Deploy Oum Malak to Cloudflare Workers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'config.json'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'build.mjs'
      - 'images/**'
      - 'dist/**'
      - '.github/workflows/cloudflare-workers.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static assets
        run: node build.mjs
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
