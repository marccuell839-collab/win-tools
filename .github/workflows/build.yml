name: Build JARVIS Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller
      - name: Test agent boundaries
        run: python -m pytest -q
      - name: Render and smoke-test interface
        run: python -m tests.smoke_ui
      - name: Package portable app
        run: python -m PyInstaller --noconfirm --windowed --onedir --name JARVIS --collect-all edge_tts --hidden-import keyring.backends.Windows --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 main.py
      - name: Include instructions
        run: Copy-Item README.md dist/JARVIS/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: dist/JARVIS/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-interface-preview
          path: ui-preview.png
